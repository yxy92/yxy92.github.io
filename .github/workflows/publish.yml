name: Publish Quarto website

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find today’s five reads
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/update-reads.mjs

      - name: Build Five Daily
        run: node scripts/build-five-daily.mjs

      - name: Save today’s edition
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "five-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data five-daily
          git diff --cached --quiet || git commit -m "daily: refresh reading list"
          git push

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        run: quarto render

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
